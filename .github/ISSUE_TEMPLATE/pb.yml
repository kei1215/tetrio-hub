name: QP PB 登録
description: QP OFFLINE(パッチ・ブックマークレット)の記録をランキングに登録します
title: "PB: "
labels: ["pb"]
body:
  - type: markdown
    attributes:
      value: |
        オフラインの記録一覧の「ランキングに送る」から開くと、下の欄が入った状態になり、リプレイ(PB-…m.ttr.json)も保存されます。
        保存されたリプレイを「リプレイ」欄にドラッグしてから「Submit new issue」を押してください(上位3人のリプレイがランキングに出ます)。
        登録は自動で行われ、この Issue は閉じられます。記録は自己申告です。
  - type: textarea
    id: data
    attributes:
      label: 記録データ(変更しないでください)
      render: json
    validations:
      required: true
  - type: textarea
    id: replay
    attributes:
      label: リプレイ(.ttr.json をここにドラッグ)
      description: 「ランキングに送る」で保存されたファイルです。なくても登録できます。
    validations:
      required: false
