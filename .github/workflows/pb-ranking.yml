name: PB ranking
# QP OFFLINE の記録を docs/ranking/data/records.json に足す。
#  issues: Issue「QP PB 登録」から / repository_dispatch(pb): ゲーム内の送信(GAS 中継)から
on:
  issues:
    types: [opened, labeled]
  repository_dispatch:
    types: [pb]
permissions:
  contents: write
  issues: write
concurrency:
  group: pb-ranking
  cancel-in-progress: false
jobs:
  ingest:
    if: github.event_name == 'repository_dispatch' || contains(github.event.issue.labels.*.name, 'pb')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add the record
        id: add
        uses: actions/github-script@v7
        env:
          PB_DISCORD_WEBHOOK: ${{ secrets.PB_DISCORD_WEBHOOK }}
        with:
          script: |
            const run = require('./.github/scripts/pb-ingest.js');
            if (context.eventName === 'repository_dispatch') {
              const msg = await run.dispatch(context.payload.client_payload);
              core.info(msg.text);
              core.setOutput('ok', msg.ok ? '1' : '0');
              return;
            }
            const msg = await run(context.payload.issue);
            core.setOutput('ok', msg.ok ? '1' : '0');
            await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number, body: msg.text });
            await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number, state: 'closed', state_reason: msg.ok ? 'completed' : 'not_planned' });
      - name: Commit
        if: steps.add.outputs.ok == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add docs/ranking/data/records.json
          git commit -m "PB ranking: add record" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
